name: CI

# Work happens on branches and reaches main through pull requests, so CI runs
# on every pull request, not twice for each branch push. On main, the Release
# workflow calls this workflow before releasing, so the commit it tests is
# the commit it releases, in the same run.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read # check out the code

# A new push to a pull request cancels the run it replaces. When Release calls
# this workflow, each run gets its own group, so CI on main is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # The even-numbered (LTS) lines that package.json "engines" allows.
        node-version:
          - 22
          - 24
          - 26

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Corepack provides the Yarn version pinned in package.json
      # "packageManager". It must be enabled before setup-node, which runs
      # Yarn to find its cache. Node.js 25 and later no longer include
      # Corepack, so it comes from the runner's default Node.js.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Formatting, then the unit tests.
      - name: Run checks and tests
        run: yarn check

  # Runs the action itself, as a workflow would, on each runner system. Its
  # inputs replace the pull request description with known texts.
  action:
    name: Action on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No AI tool was used
        id: none
        uses: ./
        with:
          author: someone
          body: |
            ## AI use

            - [x] No AI tool was used
            - [ ] AI tools were used, as described here:

      - name: AI tools were used, and how
        id: used
        uses: ./
        with:
          author: someone
          body: |
            ## AI use

            - [ ] No AI tool was used
            - [x] AI tools were used, as described here:

            Claude Code wrote the first draft of the tests.

      - name: An exempt author
        id: exempt
        uses: ./
        with:
          author: dependabot[bot]
          body: ''

      - name: No disclosure, which must fail
        id: missing
        continue-on-error: true
        uses: ./
        with:
          author: someone
          body: |
            ## What and why

            Fixes the header.

      - name: Check the results
        shell: bash
        env:
          NONE: ${{ steps.none.outputs.result }}
          USED: ${{ steps.used.outputs.result }}
          EXEMPT: ${{ steps.exempt.outputs.result }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
        run: |
          echo "none=$NONE used=$USED exempt=$EXEMPT, missing: $MISSING_OUTCOME"
          [ "$NONE" = none ] && [ "$USED" = used ] && [ "$EXEMPT" = exempt ] &&
            [ "$MISSING_OUTCOME" = failure ]

  # The one CI check the main ruleset requires, so adding or dropping a job or
  # a Node.js version in the matrix never means editing the ruleset. It runs
  # even when a job it needs fails or is cancelled, because GitHub treats a
  # skipped required check as passing.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, action]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions: {}

    steps:
      - name: Check that every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "::error::No job results to check."
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A required job ended with \"$result\"."
              exit 1
            fi
          done
